<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaSteel</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="analytics-mfe/analytics-mfe.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PortalShell.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Paint in the stored theme before the WebAssembly runtime boots, so a
        // returning dark-mode visitor never sees a flash of the light shell.
        // The Blazor shell is authoritative once it starts; this only avoids
        // the gap. Keep the cookie name in sync with wwwroot/js/shellPreferences.js.
        (function () {
            var match = document.cookie.match(/(?:^|;\s*)ns\.theme=([^;]*)/);
            var stored = match ? decodeURIComponent(match[1]).toLowerCase() : 'system';
            if (stored === 'system') {
                stored = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.dataset.theme = stored;
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" aria-label="Loading NovaSteel">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
