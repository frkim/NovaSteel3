## NovaSteel v3 portal runtime server config.
## Serves the published Blazor WebAssembly shell + React analytics MFE as static
## files on port 8080 with SPA fallback. Container Apps ingress targets 8080 and
## its startup/liveness/readiness probes hit "/".

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Blazor WebAssembly requires the correct MIME type for .wasm assets.
    types {
        application/wasm wasm;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Lightweight endpoint for local `docker run` health validation.
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Runtime configuration must never be cached so the injected BFF URL is
        # always read on load.
        location = /appsettings.json {
            add_header Cache-Control "no-store" always;
        }

        # Never cache the app shell HTML.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # Fingerprinted framework assets are safe to cache aggressively.
        location /_framework/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA fallback: serve static files when present, otherwise the Blazor
        # host page so client-side routes resolve.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
