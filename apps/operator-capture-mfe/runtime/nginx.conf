## NovaSteel v3 Operator Capture PWA runtime server config.
## Serves the built Vite bundle as static files on port 8080 with SPA fallback.
## Container Apps ingress targets 8080 and its probes hit "/healthz".

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Installability depends on the manifest being served with the right type.
    types {
        application/manifest+json webmanifest;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # getUserMedia only works on a secure context; Container Apps terminates
        # TLS in front of us, so advertise HSTS rather than redirecting here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The microphone is the whole point of this app; keep it self-only.
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Runtime configuration is rewritten on container start, so it must never
        # be cached by the browser or the service worker.
        location = /config.js {
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
        }

        # A cached service worker can never be replaced; always revalidate.
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
        }

        # Never cache the app shell HTML.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # Vite emits content-hashed filenames into /assets, safe to pin forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA fallback so client-side routes resolve on deep links / refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
