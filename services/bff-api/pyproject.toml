[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novasteel-bff-api"
version = "0.1.0"
description = "NovaSteel browser-facing FastAPI BFF with advisory analytics"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.51.0"
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
