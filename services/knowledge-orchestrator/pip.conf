# NovaSteel package-feed policy (docs/tech/security_requirement.md).
# Direct public PyPI is BLOCKED on Microsoft-managed devices. All Python package
# installation and configuration for this service MUST use only the approved
# Microsoft-protected feed below. Never add a public PyPI fallback.
[global]
index-url = https://packagefeedproxy.microsoft.io/pypi/simple
no-cache-dir = false

[install]
# Do not fall back to any other index.
