[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novasteel-optimizer-worker"
version = "0.1.0"
description = "Deterministic, constraint-aware NovaSteel energy dispatch optimizer"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
