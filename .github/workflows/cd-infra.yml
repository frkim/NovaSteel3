name: CD infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and NovaSteel target environment
        required: true
        type: choice
        options:
          - dev
          - test
          - demo
          - prod

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate templates before environment approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify protected package-feed policy
        run: >-
          python3 tools/validation/verify_protected_feeds.py --root "$GITHUB_WORKSPACE"
          --json artifacts/deployment/infra/protected-feeds.json
      - name: Install the Bicep CLI
        run: az bicep install
      - name: Run offline Bicep and PowerShell validation
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          pwsh -NoProfile -NonInteractive -File infra/scripts/validate.ps1
          -Environment "$TARGET_ENVIRONMENT" -SkipArmValidate
      - name: Publish pre-deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-predeploy-evidence-${{ github.run_id }}
          path: artifacts/deployment/infra
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: OIDC what-if and deployment
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Restrict production deployment to main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment must be dispatched from main." >&2
          exit 1
      - name: Require environment-scoped OIDC variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
      - name: Azure login via workload identity federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare deployment evidence directory
        run: mkdir -p artifacts/deployment/infra
      - name: Capture Azure what-if evidence
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          pwsh -NoProfile -NonInteractive -File infra/scripts/what-if.ps1
          -Environment "$TARGET_ENVIRONMENT"
          -OutFile "artifacts/deployment/infra/what-if-$TARGET_ENVIRONMENT.txt"
      - name: Deploy after what-if and GitHub Environment approval
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          pwsh -NoProfile -NonInteractive -File infra/scripts/deploy.ps1
          -Environment "$TARGET_ENVIRONMENT" -Force
      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-deployment-evidence-${{ github.run_id }}
          path: artifacts/deployment/infra
          if-no-files-found: warn
          retention-days: 90
