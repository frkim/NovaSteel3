name: Presentation

on:
  push:
    branches:
      - main
    paths:
      - 'presentation/**'
      - 'tests/presentation/**'
      - 'apps/portal-shell/wwwroot/brand/**'
      - 'tools/presentation/assets/**'
      - 'docs/presentation/assets/app-guide/screenshots/**'
      - '.github/workflows/presentation.yml'
  pull_request:
    paths:
      - 'presentation/**'
      - 'tests/presentation/**'
      - '.github/workflows/presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: marp-build-deck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_PROTECTED_REGISTRY || 'https://packagefeedproxy.microsoft.io/npm/' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Require an approved npm registry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NPM_CONFIG_REGISTRY"
          case "$NPM_CONFIG_REGISTRY" in
            https://registry.npmjs.org*|https://registry.yarnpkg.com*) exit 1 ;;
            https://*) ;;
            *) exit 1 ;;
          esac
      - name: Validate deck source structure and timing budget
        run: python -m pytest tests/presentation -q
      - name: Restore Marp through the protected feed
        working-directory: presentation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Build HTML, PDF, speaker-note PDF and PPTX
        working-directory: presentation
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run build
      - name: Verify the generated deck artifacts
        working-directory: presentation
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/index.html dist/NovaSteel-Oral-Defense.pdf \
            dist/NovaSteel-Oral-Defense-notes.pdf dist/NovaSteel-Oral-Defense.pptx; do
            test -s "$artifact"
            echo "ok  $artifact  $(wc -c < "$artifact") bytes"
          done
      - name: Publish the deck artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novasteel-presentation-${{ github.run_id }}
          path: |
            presentation/dist/NovaSteel-Oral-Defense.pdf
            presentation/dist/NovaSteel-Oral-Defense-notes.pdf
            presentation/dist/NovaSteel-Oral-Defense.pptx
          if-no-files-found: error
          retention-days: 90
      - name: Assemble the Pages site without speaker notes
        if: github.event_name != 'pull_request'
        working-directory: presentation
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const s=fs.readFileSync('slides.md','utf8').replace(/<!--(?!\s*_)[\s\S]*?-->/g,'');fs.writeFileSync('slides.pages.md',s);"
          npx marp --theme theme.css --html --allow-local-files slides.pages.md -o ../_site/deck/index.html
          mkdir -p ../_site/deck/images
          cp images/* ../_site/deck/images/
          cp dist/NovaSteel-Oral-Defense.pdf dist/NovaSteel-Oral-Defense.pptx ../_site/deck/
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: github-pages-deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
