name: CI build service images

on:
  pull_request:
    paths:
      - "services/bff-api/**"
      - "services/optimizer-worker/**"
      - "services/scoring-worker/**"
      - "services/ingest-relay/**"
      - "services/knowledge-orchestrator/**"
      - "services/device-simulator/**"
      - "apps/portal-shell/**"
      - "apps/analytics-mfe/**"
      - "apps/operator-capture-mfe/**"
      - "contracts/**"
  push:
    branches:
      - main
    paths:
      - "services/bff-api/**"
      - "services/optimizer-worker/**"
      - "services/scoring-worker/**"
      - "services/ingest-relay/**"
      - "services/knowledge-orchestrator/**"
      - "services/device-simulator/**"
      - "apps/portal-shell/**"
      - "apps/analytics-mfe/**"
      - "apps/operator-capture-mfe/**"
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER || 'localhost:5000' }}
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  PIP_EXTRA_INDEX_URL: ""

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      bff-api: ${{ steps.filter.outputs.bff-api }}
      optimizer-worker: ${{ steps.filter.outputs.optimizer-worker }}
      scoring-worker: ${{ steps.filter.outputs.scoring-worker }}
      ingest-relay: ${{ steps.filter.outputs.ingest-relay }}
      knowledge-orchestrator: ${{ steps.filter.outputs.knowledge-orchestrator }}
      portal-shell: ${{ steps.filter.outputs.portal-shell }}
      operator-capture-mfe: ${{ steps.filter.outputs.operator-capture-mfe }}
    steps:
      - name: Verify Azure federation variables
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLIENT_ID:-}" ] || missing+=(AZURE_CLIENT_ID)
          [ -n "${TENANT_ID:-}" ] || missing+=(AZURE_TENANT_ID)
          [ -n "${SUBSCRIPTION_ID:-}" ] || missing+=(AZURE_SUBSCRIPTION_ID)
          [ -n "${LOGIN_SERVER:-}" ] || missing+=(ACR_LOGIN_SERVER)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}. Image builds push to ACR via workload identity federation; see .github/CONFIGURATION.md."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            all=true
          fi

          changed_file=.ci-changed-images
          # Always materialise the list so `emit` never greps a missing file.
          : > "$changed_file"
          if [ "$all" = false ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            else
              git ls-files > "$changed_file"
            fi
          fi

          emit() {
            local name="$1"
            local pattern="$2"
            if [ "$all" = true ] || grep -Eq "$pattern" "$changed_file"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit bff-api '^services/(bff-api|optimizer-worker|scoring-worker|knowledge-orchestrator|device-simulator)/'
          emit optimizer-worker '^services/optimizer-worker/'
          emit scoring-worker '^services/scoring-worker/'
          emit ingest-relay '^services/ingest-relay/'
          emit knowledge-orchestrator '^services/knowledge-orchestrator/'
          emit portal-shell '^(apps/portal-shell/|apps/analytics-mfe/|contracts/)'
          emit operator-capture-mfe '^(apps/operator-capture-mfe/|contracts/)'

  build-bff-api:
    name: Build bff-api
    needs: changes
    if: needs.changes.outputs.bff-api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push bff-api
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/bff-api
          build-contexts: |
            optimizer-worker=services/optimizer-worker
            scoring-worker=services/scoring-worker
            knowledge=services/knowledge-orchestrator
            device-simulator=services/device-simulator
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/bff-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/bff-api@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-optimizer-worker:
    name: Build optimizer-worker
    needs: changes
    if: needs.changes.outputs.optimizer-worker == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push optimizer-worker
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/optimizer-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/optimizer-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/optimizer-worker@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-scoring-worker:
    name: Build scoring-worker
    needs: changes
    if: needs.changes.outputs.scoring-worker == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push scoring-worker
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/scoring-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/scoring-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/scoring-worker@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-ingest-relay:
    name: Build ingest-relay
    needs: changes
    if: needs.changes.outputs.ingest-relay == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push ingest-relay
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/ingest-relay
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/ingest-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/ingest-relay@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-knowledge-orchestrator:
    name: Build knowledge-orchestrator
    needs: changes
    if: needs.changes.outputs.knowledge-orchestrator == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push knowledge-orchestrator
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/knowledge-orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/knowledge-orchestrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/knowledge-orchestrator@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-portal-shell:
    name: Build portal-shell
    needs: changes
    if: needs.changes.outputs.portal-shell == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push portal-shell
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/portal-shell
          build-contexts: |
            analytics-mfe=apps/analytics-mfe
            contracts=contracts
            reporoot=.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/portal-shell:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/portal-shell@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-operator-capture-mfe:
    name: Build operator-capture-mfe
    needs: changes
    if: needs.changes.outputs.operator-capture-mfe == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Azure login via workload identity federation
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name != 'pull_request'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push operator-capture-mfe
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/operator-capture-mfe
          build-contexts: |
            contracts=contracts
            reporoot=.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/novasteel/operator-capture-mfe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the immutable image reference
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/novasteel/operator-capture-mfe@${DIGEST}" >> "$GITHUB_OUTPUT"

  # Only bff-api, portal-shell and operator-capture-mfe have a Container App to
  # land on: the bff image already carries optimizer-worker, scoring-worker,
  # knowledge-orchestrator and the device simulator as build contexts, which is
  # why the change filter above routes all of them to it. Promotion also stops at
  # demo, the only deployed environment; prod stays a manual dispatch so the
  # release gates in docs/tech/security-governance-and-threat-model.md (21) keep a
  # human decision.

  deploy-demo-bff-api:
    name: Deploy bff-api to demo
    needs: build-bff-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-services.yml
    with:
      environment: demo
      service: bff-api
      image: ${{ needs.build-bff-api.outputs.image }}

  deploy-demo-portal-shell:
    name: Deploy portal-shell to demo
    needs: build-portal-shell
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-services.yml
    with:
      environment: demo
      service: portal-shell
      image: ${{ needs.build-portal-shell.outputs.image }}

  deploy-demo-operator-capture-mfe:
    name: Deploy operator-capture-mfe to demo
    needs: build-operator-capture-mfe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-services.yml
    with:
      environment: demo
      service: operator-capture-mfe
      image: ${{ needs.build-operator-capture-mfe.outputs.image }}
