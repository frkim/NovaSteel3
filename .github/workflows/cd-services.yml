name: CD services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and NovaSteel target environment
        required: true
        type: choice
        options:
          - dev
          - test
          - demo
          - prod
      service:
        description: Service to promote
        required: true
        type: choice
        options:
          - bff-api
          - optimizer-worker
          - scoring-worker
          - ingest-relay
          - knowledge-orchestrator
          - portal-shell
      image:
        description: Immutable approved container image digest
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and NovaSteel target environment
        required: true
        type: string
      service:
        description: Service to promote
        required: true
        type: string
      image:
        description: Immutable approved container image digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: service-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release input and repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify protected package-feed policy
        run: >-
          python3 tools/validation/verify_protected_feeds.py --root "$GITHUB_WORKSPACE"
          --json artifacts/deployment/services/protected-feeds.json
      - name: Require an immutable image digest
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-fA-F]{64}$ ]]
      - name: Require a known environment and service
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            dev|test|demo|prod) ;;
            *) echo "Unknown environment: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          case "$SERVICE" in
            bff-api|optimizer-worker|scoring-worker|ingest-relay|knowledge-orchestrator|portal-shell) ;;
            *) echo "Unknown service: $SERVICE" >&2; exit 1 ;;
          esac
      - name: Keep automatic promotion on demo
        if: github.event_name != 'workflow_dispatch' && inputs.environment != 'demo'
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Only demo promotes automatically; $TARGET_ENVIRONMENT needs a manual dispatch." >&2
          exit 1
      - name: Publish pre-deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-predeploy-evidence-${{ github.run_id }}
          path: artifacts/deployment/services
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: OIDC service promotion
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CONTAINER_RESOURCE_GROUP: ${{ vars.CONTAINER_RESOURCE_GROUP }}
      BFF_CONTAINER_APP: ${{ vars.BFF_CONTAINER_APP }}
      OPTIMIZER_CONTAINER_APP: ${{ vars.OPTIMIZER_CONTAINER_APP }}
      SCORING_CONTAINER_APP: ${{ vars.SCORING_CONTAINER_APP }}
      INGEST_RELAY_CONTAINER_APP: ${{ vars.INGEST_RELAY_CONTAINER_APP }}
      KNOWLEDGE_CONTAINER_APP: ${{ vars.KNOWLEDGE_CONTAINER_APP }}
      PORTAL_CONTAINER_APP: ${{ vars.PORTAL_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Restrict production deployment to main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment must be dispatched from main." >&2
          exit 1
      - name: Select the environment-scoped target
        id: target
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            bff-api) app="$BFF_CONTAINER_APP" ;;
            optimizer-worker) app="$OPTIMIZER_CONTAINER_APP" ;;
            scoring-worker) app="$SCORING_CONTAINER_APP" ;;
            ingest-relay) app="$INGEST_RELAY_CONTAINER_APP" ;;
            knowledge-orchestrator) app="$KNOWLEDGE_CONTAINER_APP" ;;
            portal-shell) app="$PORTAL_CONTAINER_APP" ;;
          esac
          test -n "$CONTAINER_RESOURCE_GROUP"
          test -n "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Require environment-scoped OIDC variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
      - name: Azure login via workload identity federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote approved immutable image
        shell: bash
        env:
          TARGET_APP: ${{ steps.target.outputs.app }}
          IMAGE: ${{ inputs.image }}
          SERVICE: ${{ inputs.service }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/deployment/services
          az containerapp update \
            --name "$TARGET_APP" \
            --resource-group "$CONTAINER_RESOURCE_GROUP" \
            --image "$IMAGE"
          az containerapp show \
            --name "$TARGET_APP" \
            --resource-group "$CONTAINER_RESOURCE_GROUP" \
            --output json > "artifacts/deployment/services/${SERVICE}-${TARGET_ENVIRONMENT}.json"
      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-deployment-evidence-${{ github.run_id }}
          path: artifacts/deployment/services
          if-no-files-found: warn
          retention-days: 90
