name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      simulator: ${{ steps.filter.outputs.simulator }}
      backend: ${{ steps.filter.outputs.backend }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      frontend: ${{ steps.filter.outputs.frontend }}
      portal: ${{ steps.filter.outputs.portal }}
      infra: ${{ steps.filter.outputs.infra }}
      fabric: ${{ steps.filter.outputs.fabric }}
      presentation: ${{ steps.filter.outputs.presentation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_file=.ci-changed-files
          all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            all=true
          elif [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          else
            git ls-files > "$changed_file"
          fi

          if grep -Eq '^(tests/|tools/validation/|\.github/|package(-lock)?\.json$|pip\.conf$|NuGet\.Config$|global\.json$)' "$changed_file"; then
            all=true
          fi

          emit() {
            local name="$1"
            local pattern="$2"
            if [ "$all" = true ] || grep -Eq "$pattern" "$changed_file"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit contracts '^(contracts/|services/bff-api/)'
          emit simulator '^simulator/'
          emit backend '^services/(bff-api|optimizer-worker|scoring-worker|ingest-relay)/'
          emit knowledge '^services/knowledge-orchestrator/'
          emit frontend '^apps/analytics-mfe/'
          emit portal '^apps/portal-shell/'
          emit infra '^infra/'
          emit fabric '^fabric/'
          emit presentation '^(docs/presentation/|tools/presentation/)'

  verify-protected-feeds:
    name: verify-protected-feeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Scan executable feed configuration
        run: >-
          python tools/validation/verify_protected_feeds.py --root "$GITHUB_WORKSPACE"
          --json artifacts/validation/protected-feeds.json
      - name: Publish protected-feed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-feed-evidence-${{ github.run_id }}
          path: artifacts/validation/protected-feeds.json
          if-no-files-found: warn
          retention-days: 90

  security-gates:
    name: security-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check workflow hardening and locked requirements
        run: >-
          python tools/validation/security_scan.py --root "$GITHUB_WORKSPACE"
          --json artifacts/validation/security.json
      - name: Generate CycloneDX SBOM
        run: >-
          python tools/validation/generate_sbom.py --root "$GITHUB_WORKSPACE"
          --output artifacts/validation/novasteel.sbom.cdx.json
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.run_id }}
          path: artifacts/validation
          if-no-files-found: warn
          retention-days: 90

  contract-schema:
    name: contract-schema
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: ${{ github.workspace }}/pip.conf
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Restore pinned Python test dependencies from protected feed
        run: |
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r services/bff-api/requirements.txt
      - name: Validate contracts and schema drift
        env:
          NOVASTEEL_PYTHON: ${{ github.workspace }}/.validation-venv/bin/python
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite contract -EvidencePath artifacts/validation/contract/manifest.json -Strict
      - name: Publish contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-evidence-${{ github.run_id }}
          path: artifacts/validation/contract
          if-no-files-found: warn
          retention-days: 90

  simulator:
    name: simulator-determinism-physics
    needs: changes
    if: needs.changes.outputs.simulator == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: ${{ github.workspace }}/pip.conf
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Restore pinned Python test dependencies from protected feed
        run: |
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r services/bff-api/requirements.txt
      - name: Validate deterministic simulator scenarios and physics
        env:
          NOVASTEEL_PYTHON: ${{ github.workspace }}/.validation-venv/bin/python
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite simulator -EvidencePath artifacts/validation/simulator/manifest.json -Strict
      - name: Publish simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-evidence-${{ github.run_id }}
          path: artifacts/validation/simulator
          if-no-files-found: warn
          retention-days: 90

  backend:
    name: backend-contract-integration
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: ${{ github.workspace }}/pip.conf
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Restore pinned Python test dependencies from protected feed
        run: |
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r services/bff-api/requirements.txt
      - name: Validate backend unit, contract, integration, and local E2E journeys
        env:
          NOVASTEEL_PYTHON: ${{ github.workspace }}/.validation-venv/bin/python
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite backend -EvidencePath artifacts/validation/backend/manifest.json -Strict
      - name: Publish backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-evidence-${{ github.run_id }}
          path: artifacts/validation/backend
          if-no-files-found: warn
          retention-days: 90

  knowledge:
    name: knowledge-workflow
    needs: changes
    if: needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: ${{ github.workspace }}/pip.conf
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Restore pinned Python test dependencies from protected feed
        run: |
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r services/bff-api/requirements.txt
      - name: Validate consent, prompt defense, and knowledge publication workflow
        env:
          NOVASTEEL_PYTHON: ${{ github.workspace }}/.validation-venv/bin/python
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite knowledge -EvidencePath artifacts/validation/knowledge/manifest.json -Strict
      - name: Publish knowledge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-evidence-${{ github.run_id }}
          path: artifacts/validation/knowledge
          if-no-files-found: warn
          retention-days: 90

  frontend:
    name: react-lint-test-build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_PROTECTED_REGISTRY || 'https://packagefeedproxy.microsoft.io/npm/' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Require an approved npm registry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NPM_CONFIG_REGISTRY"
          case "$NPM_CONFIG_REGISTRY" in
            https://registry.npmjs.org*|https://registry.yarnpkg.com*) exit 1 ;;
            https://*) ;;
            *) exit 1 ;;
          esac
      - name: Restore exactly from package-lock through protected feed
        run: npm ci --ignore-scripts
      - name: Run React lint, tests, and production build
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite frontend -EvidencePath artifacts/validation/frontend/manifest.json -Strict
      - name: Audit runtime npm dependencies
        shell: bash
        run: >-
          npm audit --omit=dev --audit-level=high --registry "$NPM_CONFIG_REGISTRY"
          --json > artifacts/validation/frontend/npm-audit.json
      - name: Publish frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: artifacts/validation/frontend
          if-no-files-found: warn
          retention-days: 90

  portal:
    name: blazor-protected-restore-build
    needs: changes
    if: needs.changes.outputs.portal == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore and build Blazor through the protected NuGet source
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite portal -EvidencePath artifacts/validation/portal/manifest.json -Strict
      - name: Report vulnerable NuGet packages
        shell: bash
        run: |
          dotnet package list --project apps/portal-shell/PortalShell.csproj --vulnerable --include-transitive --format json --config NuGet.Config --no-restore > artifacts/validation/portal/nuget-vulnerabilities.json
          python3 tools/validation/check_dotnet_vulnerabilities.py --input artifacts/validation/portal/nuget-vulnerabilities.json
      - name: Publish portal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-evidence-${{ github.run_id }}
          path: artifacts/validation/portal
          if-no-files-found: warn
          retention-days: 90

  infrastructure:
    name: bicep-powershell-validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: ${{ github.workspace }}/pip.conf
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Restore pinned Python test dependencies from protected feed
        run: |
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install --disable-pip-version-check -r services/bff-api/requirements.txt
      - name: Install Bicep CLI used by static validation
        run: az bicep install
      - name: Validate Bicep and PowerShell without an Azure deployment
        env:
          NOVASTEEL_PYTHON: ${{ github.workspace }}/.validation-venv/bin/python
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite infra -EvidencePath artifacts/validation/infra/manifest.json -Strict
      - name: Publish infrastructure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrastructure-evidence-${{ github.run_id }}
          path: artifacts/validation/infra
          if-no-files-found: warn
          retention-days: 90

  fabric:
    name: fabric-local-validator
    needs: changes
    if: needs.changes.outputs.fabric == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Fabric item definitions locally
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite fabric -EvidencePath artifacts/validation/fabric/manifest.json -Strict
      - name: Publish Fabric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fabric-evidence-${{ github.run_id }}
          path: artifacts/validation/fabric
          if-no-files-found: warn
          retention-days: 90

  presentation:
    name: presentation-package-validation
    needs: changes
    if: needs.changes.outputs.presentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate PPTX package, text, and placeholders
        run: >-
          pwsh -NoProfile -File tools/validation/Validate-Repository.ps1
          -Suite presentation -EvidencePath artifacts/validation/presentation/manifest.json -Strict
      - name: Publish presentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: presentation-evidence-${{ github.run_id }}
          path: artifacts/validation/presentation
          if-no-files-found: warn
          retention-days: 90
