name: CD Fabric items

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and NovaSteel target environment
        required: true
        type: choice
        options:
          - dev
          - test
          - demo
          - prod

permissions:
  contents: read

concurrency:
  group: fabric-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Fabric definitions before environment approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify protected package-feed policy
        run: >-
          python3 tools/validation/verify_protected_feeds.py --root "$GITHUB_WORKSPACE"
          --json artifacts/deployment/fabric/protected-feeds.json
      - name: Run Fabric local validator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/deployment/fabric | Out-Null
          & ./fabric/scripts/Test-FabricAssetsLocal.ps1 |
            Tee-Object -FilePath artifacts/deployment/fabric/local-validation.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Publish pre-deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fabric-predeploy-evidence-${{ github.run_id }}
          path: artifacts/deployment/fabric
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: OIDC Fabric item synchronization
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FABRIC_PARAMETER_FILE: ${{ vars.FABRIC_PARAMETER_FILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Restrict production deployment to main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment must be dispatched from main." >&2
          exit 1
      - name: Require environment-scoped deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$FABRIC_PARAMETER_FILE"
          test -f "$FABRIC_PARAMETER_FILE"
      - name: Azure login via workload identity federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Synchronize Fabric assets through the OIDC Azure CLI context
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/deployment/fabric | Out-Null
          $state = "artifacts/deployment/fabric/$($env:TARGET_ENVIRONMENT)-state.json"
          & pwsh -NoProfile -NonInteractive -File fabric/scripts/Deploy-FabricAssets.ps1 `
            -ParameterFile "$env:FABRIC_PARAMETER_FILE" `
            -StateOutputPath $state `
            -Confirm:$false
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Publish synchronization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fabric-deployment-evidence-${{ github.run_id }}
          path: artifacts/deployment/fabric
          if-no-files-found: warn
          retention-days: 90
